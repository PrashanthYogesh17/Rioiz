<!-- Cookie & Privacy Consent Banner (Futuristic Dark Glass) -->
<div 
  x-show="$store.cookies.visible"
  x-transition:enter="transition ease-out duration-300"
  x-transition:enter-start="opacity-0 translate-y-8"
  x-transition:enter-end="opacity-100 translate-y-0"
  x-transition:leave="transition ease-in duration-200"
  x-transition:leave-start="opacity-100 translate-y-0"
  x-transition:leave-end="opacity-0 translate-y-8"
  class="fixed bottom-4 right-4 sm:bottom-6 sm:right-6 max-w-md w-[calc(100vw-2rem)] z-50 glass-panel p-5 rounded-3xl shadow-2xl border border-teal-500/30 text-slate-200"
  style="display: none;"
  role="region"
  aria-label="Cookie consent banner">
  
  <div class="flex items-start gap-3.5">
    <div class="w-9 h-9 rounded-xl bg-teal-500/20 border border-teal-500/40 flex-shrink-0 flex items-center justify-center text-teal-300">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
    </div>
    <div>
      <h3 class="text-sm font-bold text-white">Enterprise Privacy & Telemetry</h3>
      <p class="text-xs text-slate-400 mt-1 leading-relaxed">
        Rioiz uses essential session tokens and performance telemetry to guarantee sub-millisecond sync across ERP, CRM, and Billing modules.
      </p>
      
      <div class="mt-4 flex flex-wrap items-center gap-2">
        <button 
          type="button" 
          class="rioiz-btn-primary text-xs py-1.5 px-3.5"
          @click="$store.cookies.acceptAll()">
          Accept All
        </button>
        <button 
          type="button" 
          class="rioiz-btn-ghost text-xs py-1.5 px-3.5"
          @click="$store.cookies.acceptEssential()">
          Essential Only
        </button>
        <a href="/faq.html" class="text-xs text-teal-400 hover:underline px-2 py-1">
          Policy &rarr;
        </a>
      </div>
    </div>
  </div>
</div>
